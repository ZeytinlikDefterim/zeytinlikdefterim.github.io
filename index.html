<style>
/*! Zeytinlik Defterim © 2026 Fatih Aybars TAHTALI. Tüm hakları saklıdır. */
/* Layout: field-ledger app. Dark olive band with a sticky tab strip; one centred column (max 1080px). The Pano opens on the
   season's harvested tonnage; forms open as bottom sheets on phones and centred panels on desktop; olive-oil gold is the one accent. */
:root{
  --bg:#eef0e8; --surface:#fbfcf7; --sunken:#e5e9dd; --field:#ffffff; --hover:#f2f5ec;
  --line:#d4d9c9; --line-2:#bcc4af;
  --ink:#1c2217; --ink-2:#465040; --ink-3:#687161;
  --band:#2b3720; --band-2:#3a4a2b; --band-line:#435331; --band-ink:#f0f3e8; --band-ink-2:#b9c5a6;
  --leaf:#9fb27a; --leaf-2:#cdd7b6; --sync-ok:#93d18c; --sync-warn:#e9b44c;
  --olive:#46592d; --olive-ink:#3b4d24; --on-olive:#f4f6ee;
  --oil:#c99b17; --on-oil:#231b00; --oil-soft:#f4e8c2;
  --good:#2b6c3d; --good-soft:#dcebd8; --warn:#865500; --warn-soft:#f5e7c7; --bad:#ad361d; --bad-soft:#f6ddd4;
  --t-bakim:#557a32; --t-koruma:#226b69; --t-su:#2f63a0; --t-gubre:#8a5a2b; --t-hasat:#a27a0a; --t-in:#2b6c3d; --t-out:#9d4a29; --t-not:#56607c;
  --scrim:rgba(18,24,12,.48);
  --shadow:0 1px 0 rgba(30,40,20,.05),0 12px 28px -14px rgba(30,40,20,.35);
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160f; --surface:#1a2016; --sunken:#232b1e; --field:#151a12; --hover:#212919;
    --line:#2f3828; --line-2:#435039;
    --ink:#e9eddf; --ink-2:#bec7b0; --ink-3:#919a84;
    --band:#0c1009; --band-2:#1c2416; --band-line:#263021; --band-ink:#eef1e6; --band-ink-2:#a9b696;
    --olive:#adc47f; --olive-ink:#c4d99c; --on-olive:#161d10;
    --oil:#e2b83b; --on-oil:#221a00; --oil-soft:#3a3214;
    --good:#86c98f; --good-soft:#1d3222; --warn:#e8b155; --warn-soft:#382b13; --bad:#f28a6c; --bad-soft:#3d1f17;
    --t-bakim:#a3c672; --t-koruma:#6ec4bf; --t-su:#86b4ee; --t-gubre:#d39f6a; --t-hasat:#e3b83c; --t-in:#86c98f; --t-out:#ee9d79; --t-not:#a6b0d2;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12160f; --surface:#1a2016; --sunken:#232b1e; --field:#151a12; --hover:#212919;
  --line:#2f3828; --line-2:#435039;
  --ink:#e9eddf; --ink-2:#bec7b0; --ink-3:#919a84;
  --band:#0c1009; --band-2:#1c2416; --band-line:#263021; --band-ink:#eef1e6; --band-ink-2:#a9b696;
  --olive:#adc47f; --olive-ink:#c4d99c; --on-olive:#161d10;
  --oil:#e2b83b; --on-oil:#221a00; --oil-soft:#3a3214;
  --good:#86c98f; --good-soft:#1d3222; --warn:#e8b155; --warn-soft:#382b13; --bad:#f28a6c; --bad-soft:#3d1f17;
  --t-bakim:#a3c672; --t-koruma:#6ec4bf; --t-su:#86b4ee; --t-gubre:#d39f6a; --t-hasat:#e3b83c; --t-in:#86c98f; --t-out:#ee9d79; --t-not:#a6b0d2;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,label,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-num);font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700}
.lnk{background:none;border:0;padding:0;color:var(--olive-ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit}

/* band + tabs */
.band{background:var(--band);color:var(--band-ink)}
.band-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:36px;height:36px;flex:none}
.farm{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.place{font-size:12.5px;color:var(--band-ink-2);overflow-wrap:anywhere}
.band-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--band-ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--band-ink-2)}
.sync[data-state=account] i{background:var(--sync-ok)}
.sync[data-state=device] i{background:var(--leaf-2)}
.sync[data-state=memory] i,.sync[data-state=lost] i{background:var(--sync-warn)}
.season-sel select{background:var(--band-2);color:var(--band-ink);border:1px solid var(--band-line);border-radius:999px;min-height:36px;padding:4px 12px;font-weight:700;font-size:14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);border-bottom:1px solid var(--band-line)}
.tabs-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:11px 11px 10px;color:var(--band-ink-2);text-decoration:none;font-weight:700;font-size:14.5px;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--band-ink)}
.tabs a[aria-current=page]{color:var(--band-ink);border-bottom-color:var(--oil)}
.notice-w{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
.notice{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:700}
.notice.info{background:var(--sunken);color:var(--ink-2);font-weight:400}
.notice #noticeT{flex:1 1 260px}

/* page */
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 128px}
.sh{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin:32px 0 10px}
.sh.first{margin-top:4px}
.sh h2{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sh .meta{color:var(--ink-3);font-size:13.5px}
.sh .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px 28px;align-items:end}
.hero-a{display:flex;flex-direction:column;gap:8px;min-width:0}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,10vw,70px);letter-spacing:-.035em;line-height:.92;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:2px}
.big small{font-size:.36em;letter-spacing:0;font-weight:700;color:var(--ink-2);margin-left:8px}
.facts{display:flex;flex-wrap:wrap;gap:3px 14px;color:var(--ink-2);font-size:13.5px}
.facts span{white-space:nowrap}
.est{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.est .t{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.est .t b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.prog{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;border-radius:5px;background:var(--t-hasat)}
.today{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.today b{font-family:var(--f-num)}
.hero-b{min-width:0}
.hero-b .cap{margin-bottom:6px}
.none{color:var(--ink-3);font-size:13.5px;padding:26px 14px;border:1px dashed var(--line-2);border-radius:10px;text-align:center}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.kpi{padding:14px 16px 15px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:clamp(18px,2.6vw,23px);margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.v.pos{color:var(--good)} .v.neg{color:var(--bad)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:12px 13px}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

/* alerts */
.alerts{list-style:none;margin:0;padding:0;overflow:hidden}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:0 12px 0 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .st{align-self:stretch;background:var(--warn)}
.alert[data-sev=bad] .st{background:var(--bad)}
.alert[data-sev=info] .st{background:var(--t-not)}
.alert .tx{padding:11px 0;min-width:0}
.alert .t{font-weight:700;overflow-wrap:anywhere}
.alert .d{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.calm{padding:14px 16px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:var(--r)}

/* harvest status */
.hs{overflow:hidden}
.hs-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
.hs-r:first-child{border-top:0}
.hs-r .hs-n{display:flex;flex-direction:column;align-items:flex-start;flex-wrap:nowrap;gap:1px;min-width:0;padding:2px 0}
.hs-n b{overflow-wrap:anywhere;text-align:left}
.hs-n span{font-size:12.5px;color:var(--ink-3);text-align:left}
@media (max-width:460px){.hs-r{grid-template-columns:minmax(0,1fr) auto auto}.hs-r>.chip{grid-column:1/-1;justify-self:start}}

/* days */
.days{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.day+.day{border-top:1px solid var(--line-2)}
.day-h{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px 8px}
.cum{text-align:right;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap}
.cum b{display:block;font-family:var(--f-num);font-size:14px;color:var(--ink-2);letter-spacing:0;text-transform:none;font-weight:500}
.day-s{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;padding:7px 14px 7px 68px;border:0;border-top:1px dashed var(--line);background:none;text-align:left;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.day-s:hover{background:var(--hover)}
.day-s .n{font-family:var(--f-num);color:var(--ink);white-space:nowrap;font-size:13px}
.day-s:last-child{padding-bottom:10px}
.mm{color:var(--warn);font-weight:700}
@media (max-width:420px){.day-s{padding-left:14px;grid-template-columns:minmax(0,1fr)}.day-s .n{justify-self:start}}

/* ledger */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ledger+.ledger{margin-top:14px}
.lg-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;background:var(--sunken);font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.lg-h .n{font-family:var(--f-num);letter-spacing:0;text-transform:none;font-weight:500}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;cursor:pointer}
.row:first-child,.lg-h+.row{border-top:0}
.row:hover{background:var(--hover)}
.dd{text-align:center;line-height:1}
.dd b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700}
.dd span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.rm{display:flex;flex-direction:column;gap:3px;min-width:0}
.rl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pn{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.rt{font-weight:700;overflow-wrap:anywhere}
.rs{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap;font-size:14px}
.amt.in{color:var(--good)} .amt.n{color:var(--ink-3)}
.amt small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink-3)}
@media (max-width:420px){.row{grid-template-columns:36px minmax(0,1fr)}.row .amt{grid-column:2;text-align:left}}

.chip{--tone:var(--t-not);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px 2px 7px;border-radius:999px;color:var(--tone);background:var(--sunken);background:color-mix(in srgb,var(--tone) 14%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tone-bakim{--tone:var(--t-bakim)} .tone-koruma{--tone:var(--t-koruma)} .tone-su{--tone:var(--t-su)} .tone-gubre{--tone:var(--t-gubre)}
.tone-hasat{--tone:var(--t-hasat)} .tone-in{--tone:var(--t-in)} .tone-out{--tone:var(--t-out)} .tone-not{--tone:var(--t-not)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-p{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.btn-p:hover{background:var(--olive);filter:brightness(1.08)}
.btn-sm{min-height:34px;padding:4px 11px;font-size:13.5px}
.btn-q{border-color:transparent;background:transparent;color:var(--olive-ink)}
.btn-q:hover{background:var(--hover)}
.btn-d{color:var(--bad);border-color:var(--line-2)}
.btn-dd{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--oil);color:var(--on-oil);font-weight:700;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
.fab svg{width:20px;height:20px}

/* empty + loading */
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-size:15.5px}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap}
.loading{padding:18px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--r)}

/* start */
.start{margin-top:16px;padding:16px 18px;background:var(--oil-soft);border-radius:var(--r)}
.start h2{font-family:var(--f-display);font-size:19px;margin:0 0 8px}
.start ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.start .btn{margin-left:6px;vertical-align:middle}

/* tasks */
.tasks{overflow:hidden}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--olive);margin:0}
.tt-b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;min-width:0}
.tt{font-weight:700;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.due{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.due.late{color:var(--bad);font-weight:600}
.task-h{padding:8px 14px;background:var(--sunken);font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
details.done-list summary{cursor:pointer;padding:10px 14px;color:var(--ink-2);font-weight:700}

/* calendar */
.month ul,.mon ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.month li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)}
.month li:first-child{border-top:0}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.mon{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px}
.mon.now{border-color:var(--oil);box-shadow:inset 0 0 0 1px var(--oil)}
.mon h3{font-family:var(--f-display);font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mon h3 span{font-family:var(--f-body);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:700}
.mon li{display:flex;flex-direction:column;gap:3px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.mon li:first-of-type{border-top:0}
.note-s{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}

/* chart + bars */
.chart-w{padding:14px 12px 8px}
.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--ink-3);font-family:var(--f-num);font-size:10.5px}
.chart .b-out{fill:var(--t-out)} .chart .b-in{fill:var(--t-in)} .chart .b-h{fill:var(--t-hasat)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:0 14px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.bar .n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.bar .tr{grid-column:1/-1;height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--t-out);border-radius:4px}
.bar .tr i.h{background:var(--t-hasat)}

/* money lists */
.mlist{overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .who{font-weight:700;overflow-wrap:anywhere}
.mrow .sub{font-size:12.5px;color:var(--ink-3)}
.mrow .sub.late{color:var(--bad);font-weight:700}
.mrow .r{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mh{padding:8px 14px;background:var(--sunken);font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;gap:8px}
.mh .n{font-family:var(--f-num);text-transform:none;letter-spacing:0}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.off{opacity:.7}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.15;overflow-wrap:anywhere}
.card .sub{font-size:13px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.stats>div{min-width:0}
.stats .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stats .v{font-family:var(--f-num);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats .v.t{font-family:var(--f-body);font-weight:700}
.hv{display:flex;flex-direction:column;gap:7px}
.hv-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.line{font-size:13px;padding:7px 10px;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
.line.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.line.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.card-f{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken);font-weight:700}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:first-child td{border-top:0}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-size:13.5px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)}
tfoot td{font-weight:700;background:var(--sunken)}
.acid{display:inline-block;font-family:var(--f-body);font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.acid.good{background:var(--good-soft);color:var(--good)} .acid.warn{background:var(--warn-soft);color:var(--warn)} .acid.bad{background:var(--bad-soft);color:var(--bad)}
.tag-low{color:var(--bad);font-weight:700}

/* price table */
.ptw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.ptab th{background:var(--sunken);text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink-2);white-space:normal;padding:8px}
.ptab td{padding:6px 8px}
.ptab td:first-child{font-weight:700;white-space:nowrap;vertical-align:middle}
.ptab input{width:100%;min-width:72px;min-height:42px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--field);font-family:var(--f-num);text-align:right;font-size:16px}

/* defter toolbar */
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 14px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:36px;padding:4px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb select,.tb input{min-height:42px;padding:6px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--field);font-size:16px;flex:1 1 170px;min-width:0}
.sumline{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
.sumline b{font-family:var(--f-num);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .16s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-top:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease}
.sheet:focus{outline:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 6px}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:5vh;width:min(680px,calc(100% - 48px));transform:translateX(-50%);border-radius:16px;max-height:90vh;animation:fade .16s ease;padding-left:22px;padding-right:22px}
  .sheet.wide{width:min(860px,calc(100% - 48px))}
  .grab{display:none}
}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0 12px;position:sticky;top:-6px;background:var(--surface);z-index:2}
.sheet-h h2{font-family:var(--f-display);font-size:23px;margin:2px 0 0;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2)}
.sheet-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin-top:16px;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2}
.sheet-f .sp{flex:1}
.sheet-f .confirm{font-weight:700;color:var(--bad)}
.sheet-body{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-body p{margin:0 0 10px;color:var(--ink-2)}
fieldset.fs{border:0;margin:0;padding:0;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field[hidden]{display:none!important}
.field>label:not(.check),.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.req{color:var(--bad);margin-left:2px}
.field input[type=text],.field input[type=date],.field input[type=search],.field input[type=email],.field input[type=password],.field select,.field textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--field);font-size:16px}
.field textarea{min-height:66px;resize:vertical}
.inp-u{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:9px;background:var(--field);overflow:hidden;min-width:0}
.field .inp-u input[type=text]{border:0;border-radius:0;flex:1;min-width:0}
.inp-u .u{display:flex;align-items:center;padding:0 10px;color:var(--ink-3);font-size:13px;background:var(--sunken);border-left:1px solid var(--line);white-space:nowrap}
.inp-u .u:empty{display:none}
.inp-u:focus-within{outline:2px solid var(--oil);outline-offset:1px}
.inp-u input:focus-visible{outline:none}
.hint{font-size:12.5px;color:var(--ink-3)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;display:inline-flex}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.pill span{display:inline-flex;align-items:center;min-height:40px;padding:6px 13px;border:1px solid var(--line-2);border-radius:999px;font-weight:700;font-size:14px;background:var(--field)}
.pill input:checked+span{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.pill input:focus-visible+span{outline:2px solid var(--oil);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--olive)}
.calg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.cal-i{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink-2);min-width:0}
.field .cal-i .inp-u input[type=text]{min-height:42px;padding:7px 9px}
.calc{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.calc:empty{display:none}
.cl{font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
.cl b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.cl .btn{margin-left:8px}
.cl.warn{background:var(--warn-soft);color:var(--warn)} .cl.warn b{color:var(--warn)}
.cl.bad{background:var(--bad-soft);color:var(--bad)} .cl.bad b{color:var(--bad)}
.cl.good{background:var(--good-soft);color:var(--good)} .cl.good b{color:var(--good)}
.ferr{margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px}
.mv{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mv .eyebrow{padding:8px 12px;background:var(--sunken)}
.mv-r{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px}
.mv-r .n{font-family:var(--f-num);text-align:right}

/* crew */
.crew{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.crew-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 10px;background:var(--sunken);border-bottom:1px solid var(--line)}
.crew-top .inp-u{flex:1 1 150px}
.crew-r{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.crew-top+.crew-r{border-top:0}
.crew-n{min-width:0}
.crew-n b{display:block;overflow-wrap:anywhere}
.crew-n span{font-size:12px;color:var(--ink-3)}
.crew .inp-u input[type=text]{min-height:40px;padding:6px 8px;border:0;border-radius:0;background:transparent;width:100%;min-width:0;font-size:16px}
.seg3{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg3 button{min-height:38px;min-width:46px;padding:0 9px;border:0;border-left:1px solid var(--line-2);background:var(--field);font-weight:700;font-size:13px;cursor:pointer}
.seg3 button:first-child{border-left:0}
.seg3 button[aria-pressed=true]{background:var(--olive);color:var(--on-olive)}
.crew-add{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:8px;align-items:center;padding:9px 10px;background:var(--sunken);border-top:1px solid var(--line)}
.crew .crew-add>input[type=text]{min-height:40px;padding:6px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--field);min-width:0;width:100%;font-size:16px}
.crew-empty{padding:12px;color:var(--ink-3);font-size:13.5px}
@media (max-width:460px){.crew-r,.crew-add{grid-template-columns:minmax(0,1fr) 96px}.crew-r .seg3,.crew-add .btn{grid-column:1/-1}.seg3 button{flex:1}}

/* picker */
.pick-g h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:14px 0 8px}
.pick-g:first-child h3{margin-top:4px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pk{--tone:var(--t-not);display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.pk:hover{border-color:var(--line-2);background:var(--hover)}
.pk b{display:flex;align-items:center;gap:8px;font-size:15px}
.pk b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tone);flex:none}
.pk span{font-size:12.5px;color:var(--ink-3)}

/* settings */
.set-form{padding:16px}
.set-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.prose{max-width:66ch;color:var(--ink-2)}
.prose p{margin:0 0 8px}
.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.imp-t{width:100%;min-height:96px;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--field);font-family:var(--f-num);font-size:16px;resize:vertical}

/* variety + sieve */
.vseg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;overflow:visible;margin-bottom:10px}
.vseg button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:50px;padding:6px 12px;border-radius:12px;text-align:left;line-height:1.2;white-space:normal;overflow-wrap:anywhere}
.sk{font-family:var(--f-num);font-weight:500;font-size:12.5px;opacity:.8}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
@media (min-width:1000px){.vgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vgrid.two details.mx summary{padding-top:0}}
.bar.z{color:var(--ink-3)}
.mx table{font-size:13px}
.mx th,.mx td{padding:8px 10px}
.mx td.n{font-size:13px}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;z-index:1;white-space:nowrap;background:var(--surface);box-shadow:inset -1px 0 0 var(--line)}
.mx thead th:first-child,.mx tfoot td:first-child{background:var(--sunken)}
.mx tr.z td{color:var(--ink-3)}
.ve{overflow:hidden}
.ve-h{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;padding:14px 16px 4px}
.ve-kg{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.ve-s{font-size:13px;color:var(--ink-2);text-align:right;line-height:1.5}
.ve-n{padding:0 16px 14px;margin:0}
details.mx{margin:0}
details.mx summary{cursor:pointer;padding:10px 2px;font-weight:700;color:var(--olive-ink)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip .cv{font-style:normal;color:var(--ink-3);margin-left:-1px}
.vchip{display:inline-flex;align-items:baseline;gap:6px;min-height:36px;padding:5px 10px 5px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.vchip b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.vchip:hover{background:var(--hover)}

/* phone: bottom tab bar instead of the top strip */
.bnav{display:none}
.more{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.more-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
.more-i:first-child{border-top:0}
.more-i b{font-size:16px}
.more-i span{grid-column:1;font-size:13px;color:var(--ink-3)}
.more-i i{grid-row:1/3;grid-column:2;font-style:normal;color:var(--ink-3);font-size:20px}
.more-i[aria-current=page]{background:var(--hover)}
.more-i[aria-current=page] b{color:var(--olive-ink)}
@media (max-width:700px){
  .tabs,.fab{display:none}
  .season-sel select{font-size:16px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--band);border-top:1px solid var(--band-line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:54px;padding:6px 2px 4px;color:var(--band-ink-2);text-decoration:none;font-size:11.5px;font-weight:700;background:none;border:0;cursor:pointer}
  .bnav svg{width:24px;height:24px;flex:none}
  .bnav [aria-current=page],.bnav .on{color:var(--band-ink)}
  .bnav [aria-current=page] svg,.bnav .on svg{color:var(--oil)}
  .bnav .bnav-add{color:var(--band-ink)}
  .bnav .plus{display:grid;place-items:center;width:46px;height:46px;margin-top:-20px;border-radius:50%;background:var(--oil);color:var(--on-oil);box-shadow:0 0 0 4px var(--band),var(--shadow)}
  .bnav .plus svg{width:22px;height:22px}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-block-end:calc(104px + env(safe-area-inset-bottom,0px))}
}
.imp-f{display:block;margin:6px 0 14px;max-width:100%}
.appfoot{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px;margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--ink-3);text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* sunucu: giriş ekranı, salt okunur defter, yönetici */
.auth{max-width:460px;margin:28px auto 0;padding:22px 20px}
.auth h2{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.auth>p{margin:0 0 16px;color:var(--ink-2)}
.auth .btn{width:100%}
.auth .fgrid{grid-template-columns:minmax(0,1fr);margin-top:12px}
.auth .seg{margin-top:4px}
.auth .seg button{flex:1}

/* ---------- sezon ---------- */
const startMonth = () => { const m = Math.round(+S.settings.seasonStart); return m >= 1 && m <= 12 ? m : 9; };
function seasonOf(dateStr){
  const d = parseD(dateStr); if (!d) return null;
  const sm = startMonth(), y = d.getFullYear(), m = d.getMonth() + 1;
  if (sm === 1) return String(y);
  const st = m >= sm ? y : y - 1;
  return st + '/' + pad((st + 1) % 100);
}
function seasonMonths(id){
  const sm = startMonth(), y = parseInt(id, 10), out = [];
  for (let i = 0; i < 12; i++) { const d = new Date(y, sm - 1 + i, 1); out.push({y: d.getFullYear(), m: d.getMonth() + 1, cost: 0, inc: 0}); }
  return out;
}
function seasonsList(){
  const set = new Set([seasonOf(todayStr()), S.season]);
  [S.records, S.labor, S.pay].forEach(a => a.forEach(x => { const s = seasonOf(x.date); if (s) set.add(s); }));
  return Array.from(set).filter(Boolean).sort().reverse();
}

/* ---------- hasat hesapları ---------- */
const calSum = r => r && r.cal ? CAL_KEYS.reduce((a, k) => a + (+r.cal[k[0]] || 0), 0) : 0;
const calMismatch = r => { const cs = calSum(r); return cs > 0 && Math.abs(cs - (+r.kg || 0)) > 0.5; };
function priceRow(v){ const p = v ? (S.settings.prices || {})[v] : null; return p && typeof p === 'object' && Object.keys(p).some(k => +p[k] > 0) ? p : null; }
function valueOf(r){
  const p = priceRow(r.variety); if (!p) return null;
  if (calSum(r) > 0) { let v = 0, any = false; CAL_KEYS.forEach(k => { const q = +r.cal[k[0]] || 0, pr = +p[k[0]] || 0; if (q && pr) { v += q * pr; any = true; } }); return any ? v : null; }
  if (r.purpose === 'Yağlık' && +p.y > 0 && +r.kg > 0) return r.kg * p.y;
  return null;
}
function ownShare(r){
  const ids = (r.parcels || []).filter(id => PMAP[id]);
  if (!ids.length) return 1;
  let tot = 0, own = 0;
  ids.forEach(id => { const w = +PMAP[id].trees || +PMAP[id].area || 1; tot += w; if (PMAP[id].own !== CUST) own += w; });
  return tot ? own / tot : 1;
}
const pStatus = p => (p.done && p.done[skey(S.season)]) ? 'Bitti' : (((D && D.PS[p.id]) || {}).kg > 0 ? 'Devam ediyor' : 'Bekliyor');
const pEst = p => { const e = p.est ? p.est[skey(S.season)] : null; return ok(e) ? e : null; };

const cl = (html, cls) => '<div class="cl ' + (cls || '') + '">' + html + '</div>';
const unitConv = u => u === 'ton' ? 1000 : u === 'g' ? 0.001 : u === 'ml' ? 0.001 : 1;
const unitBase = u => u === 'ton' || u === 'g' ? 'kg' : u === 'ml' ? 'L' : (u || '');
function oilKgOf(q, u){ q = +q; if (!ok(q)) return null; if (u === 'kg') return q; if (u === 'L') return q * OIL_DENSITY; if (u === 'teneke') return q * tinKg(); return null; }
function acidClass(a){
  if (!ok(a)) return null;
  if (a <= 0.8) return {label: 'natürel sızma sınırında', short: 'sızma sınırı', cls: 'good'};
  if (a <= 2) return {label: 'natürel birinci sınırında', short: 'birinci sınırı', cls: 'warn'};
  return {label: '%2 üstü, sızma ve birinci sınırının dışında', short: '%2 üstü', cls: 'bad'};
}
function stockLeft(c, it, field){
  const back = c.editing && c.doc && c.doc.stockId === it.id ? (+c.doc[field] || 0) : 0;

}

TYPES.hasat.calc = (v, c) => {
  const ps = parcelSel(v);
  if (c.changed === 'parcels' && !v.variety && ps.length === 1 && VARIETIES.indexOf(ps[0].variety) >= 0) c.setText('variety', ps[0].variety, true);
  const cs = v.cal ? calSum(v) : 0;
  if (cs > 0) c.setNum('kg', cs);
  const kg = toNum(c.val('kg'));
  const out = [];
  ps.forEach(p => { const st = D.PS[p.id]; if (st && st.safe && v.date && v.date < st.safe) out.push(cl(esc(p.name) + ': son ilaçlamanın bekleme süresi <b>' + fmtD(st.safe) + '</b> tarihinde doluyor. Bu tarihten önce hasat etme.', 'bad')); });
  if (cs > 0 && ok(kg) && Math.abs(cs - kg) > 0.5) out.push(cl('Eleklerin toplamı <b>' + num(cs, 1) + ' kg</b>, toplam <b>' + num(kg, 1) + ' kg</b> yazılı.<button type="button" class="btn btn-sm" data-act="kgFromCal">Toplamı ' + num(cs, 1) + ' kg yap</button>', 'warn'));
  const val = valueOf(Object.assign({}, v, {kg: kg}));
  if (val) out.push(cl('Tahmini değer <b>' + tl(val) + '</b> · ' + esc(v.variety) + ' fiyat listesine göre', 'good'));
  else if (cs > 0 && v.variety && !priceRow(v.variety)) out.push(cl('Fiyat listesinde ' + esc(v.variety) + ' yok. Hasat sekmesindeki fiyat listesine eklersen tahmini değer hesaplanır.'));
  if (v.date && ok(kg) && kg > 0) {
    const others = S.records.filter(r => r.type === 'hasat' && r.date === v.date && !(c.editing && r.id === c.doc.id));
    if (others.length) {
      const tot = kg + sum(others, 'kg'), ppl = Math.max(+v.workers || 0, ...others.map(r => +r.workers || 0));
      out.push(cl(esc(fmtD(v.date)) + ' toplamı <b>' + num(tot) + ' kg</b> · ' + (others.length + 1) + ' bahçe' + (ppl ? ' · kişi başı <b>' + num(tot / ppl) + ' kg</b>' : '')));
    } else if (ok(v.workers) && v.workers > 0) out.push(cl('Kişi başı <b>' + num(kg / v.workers) + ' kg</b>' + (ok(v.crates) && v.crates > 0 ? ' · kasa başı <b>' + num(kg / v.crates, 1) + ' kg</b>' : '')));
  }
  const own = ps.filter(p => p.own !== CUST);
  if (own.length && ok(kg)) {
    const prev = own.reduce((a, p) => a + ((D.PS[p.id] && D.PS[p.id].kg) || 0), 0) - (c.editing && seasonOf(c.doc.date) === S.season ? (+c.doc.kg || 0) : 0);
    const trees = sum(own, 'trees');
    if (trees > 0) out.push(cl('Bu bahçelerden sezonda toplam <b>' + num(prev + kg) + ' kg</b> · <b>' + num((prev + kg) / trees, 1) + ' kg / ağaç</b>'));
  }
  return out.join('');
};

/* ---------- kayıt yeri: hesap, cihaz ya da geçici ---------- */
const live = () => S.store === 'account';
const base = () => 'data/users/' + S.uid;
const colRef = col => S.db.collection(base() + '/defter/' + col);
const setRef = () => S.db.doc(base() + '/settings');
function clean(o){
  if (Array.isArray(o)) return o.map(clean);
  if (o && typeof o === 'object') { const r = {}; Object.keys(o).forEach(k => { const v = o[k]; if (k === 'id' || v === undefined) return; r[k] = typeof v === 'number' && !isFinite(v) ? null : clean(v); }); return r; }
  return o;
}
async function retry(fn){
  try { return await fn(); }
  catch (e) {
    const c = e && e.code;
    if (c === 'unavailable' || c === 'resource_exhausted') { await new Promise(r => setTimeout(r, (c === 'resource_exhausted' ? 1500 : 300) + Math.random() * 700)); return await fn(); }
    throw e;
  }
}
/* Salt okunur defter (yönetici başka bir kullanıcının defterine bakarken): kendi verin OWN'da bekler,
   dinleyiciler oraya yazar, bütün yazma yolları kapanır. */
let G = null, OWN = null, unsubs = [];
const ROERR = {code: 'readonly'};
function setOwn(k, v){ if (G && OWN) OWN[k] = v; else S[k] = v; }
let lsT = 0, dirty = false;
function persistLocal(){ if (S.store !== 'device' || G) return; dirty = true; clearTimeout(lsT); lsT = setTimeout(flushLocal, 250); }
function flushLocal(){
  clearTimeout(lsT); lsT = 0;
  if (S.store !== 'device' || !dirty) return;
  const src = G && OWN ? OWN : S;
  const data = {v: 1, program: APP_NAME, savedAt: new Date().toISOString(), settings: src.settings};
  COLS.forEach(c => { data[c] = src[c]; });
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); dirty = false; if (S.storeErr) { S.storeErr = false; schedule(); } }
  catch (e) { if (!S.storeErr) { S.storeErr = true; schedule(); } }
}
function applyLocal(d){
  if (!d || typeof d !== 'object') d = {};
  setOwn('settings', Object.assign({}, DEFAULTS, d.settings && typeof d.settings === 'object' ? d.settings : {}));
  COLS.forEach(c => { setOwn(c, Array.isArray(d[c]) ? d[c].filter(x => x && typeof x === 'object' && x.id) : []); S.loaded[c] = true; });
  S.loaded.settings = true;
}
window.addEventListener('storage', e => {
  if (e.key !== LS_KEY || S.store !== 'device' || dirty) return;
  try { applyLocal(e.newValue ? JSON.parse(e.newValue) : {}); schedule(); } catch (x) {}
});
function upsertLocal(col, id, body){ const arr = S[col], i = arr.findIndex(x => x.id === id), d = Object.assign({}, body, {id: id}); if (i >= 0) arr[i] = d; else arr.push(d); }
async function dbSet(col, id, data){
  if (G) throw ROERR;
  const body = clean(data);
  if (!live()) { const nid = id || uid(); upsertLocal(col, nid, body); persistLocal(); schedule(); return nid; }
  const ref = id ? colRef(col).doc(id) : colRef(col).doc();
  await retry(() => ref.set(body));
  return ref.id;
}
async function dbUpdate(col, id, patch){
  if (G) throw ROERR;
  const body = clean(patch);
  if (!live()) { const arr = S[col], i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = deepMerge(arr[i], body); persistLocal(); schedule(); return; }
  await retry(() => colRef(col).doc(id).update(body));
}
async function dbDel(col, id){
  if (G) throw ROERR;
  if (!live()) { S[col] = S[col].filter(x => x.id !== id); persistLocal(); schedule(); return; }
  await retry(() => colRef(col).doc(id).delete());
}
async function putSettings(data){
  if (G) throw ROERR;
  const body = clean(data);
  if (!live()) { S.settings = Object.assign({}, DEFAULTS, body); persistLocal(); schedule(); return; }
  await retry(() => setRef().set(body));
}
function writeMsg(e){
  const c = e && e.code;
  if (c === 'readonly') return 'Bu defter salt okunur; değişiklik yapamazsın.';
  if (c === 'permission-denied') return 'Kaydedilemedi: sunucu izin vermedi. Çıkış yapıp yeniden giriş yap.';
  if (c === 'unauthenticated') return 'Oturumun kapanmış. Yeniden giriş yap.';
  if (c === 'resource-exhausted') return 'Sunucunun günlük kotası doldu. Yarın tekrar dene.';
  if (c === 'invalid_argument') return 'Kaydedilemedi. Bu sayfada kayıt izni olmayabilir; sayfayı yenileyip tekrar dene.';
  if (c === 'quota_exceeded') return 'Kayıt alanı doldu. Eski kayıtlardan bazılarını silmen gerekiyor.';
  if (c === 'resource_exhausted') return 'Arka arkaya çok kayıt gönderildi. Birkaç saniye sonra tekrar dene.';
  if (c === 'revoked') return 'Bu sayfaya erişimin değişti. Sayfayı yenile.';
  return 'Kaydedilemedi. Bağlantını kontrol edip tekrar dene.';
}
function onDbError(e){
  if (!e) return;
  if (['unavailable', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'permission-denied', 'unauthenticated'].indexOf(e.code) >= 0) { S.lost = true; S.lostCode = e.code; schedule(); }
}
function goDevice(){
  let d = null, okStore = true;
  try {
    const raw = localStorage.getItem(LS_KEY);
    d = raw ? JSON.parse(raw) : {};
    localStorage.setItem(LS_KEY + ':test', '1'); localStorage.removeItem(LS_KEY + ':test');
  } catch (e) { okStore = false; }
  S.store = okStore ? 'device' : 'memory';
  applyLocal(d);
  if (!S.seasonPicked) S.season = seasonOf(todayStr());
  schedule();
}
function goAccount(db, uidv){
  S.db = db; S.uid = uidv; S.store = 'account';
  COLS.forEach(col => {
    unsubs.push(colRef(col).onSnapshot(snap => {
      setOwn(col, snap.docs.map(d => Object.assign({}, d.data(), {id: d.id})));
      S.loaded[col] = true; schedule();
    }, onDbError));
  });
  unsubs.push(setRef().onSnapshot(s => {
    setOwn('settings', Object.assign({}, DEFAULTS, s.exists ? s.data() : {}));
    S.loaded.settings = true;
    if (!S.seasonPicked) S.season = seasonOf(todayStr());
    schedule();
  }, onDbError));
  schedule();
}
async function connect(){
  if (FBCFG) return connectFB();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return goDevice();
  const safe = f => { try { return Promise.resolve(f()).catch(() => null); } catch (e) { return Promise.resolve(null); } };
  const got = await Promise.all([safe(() => c.use('db')), safe(() => c.use('user')), safe(() => c.use('downloads'))]);
  const db = got[0], user = got[1];
  S.dl = got[2];
  if (!db) S.signedOut = true;
  if (db && user) {
    let id = null; try { id = await user.id(); } catch (e) {}
    if (!id) S.signedOut = true;
    if (id) {
      let r = [false, false, null];
      try { r = await Promise.all([user.isOwner(), user.canEdit(), user.can('data.write')]); } catch (e) {}
      if (r[0] || r[1] || r[2] === true) return goAccount(db, id);
    }
  }
  goDevice();
}

let sumT = 0, lastSum = '', seenAt = 0;
function stopListeners(){ unsubs.forEach(f => { try { if (typeof f === 'function') f(); } catch (e) {} }); unsubs = []; }
function resetData(){ S.settings = Object.assign({}, DEFAULTS); COLS.forEach(c => { S[c] = []; }); S.loaded = {}; S.db = null; S.uid = null; S.lost = false; lastSum = ''; }
async function connectFB(){
  S.auth = 'loading'; schedule();
  let P, A, F;
  try { const m = await Promise.all([import(FBURL + 'firebase-app.js'), import(FBURL + 'firebase-auth.js'), import(FBURL + 'firebase-firestore.js')]); P = m[0]; A = m[1]; F = m[2]; }
  catch (e) { S.auth = 'error'; schedule(); return; }
  try {
    const app = P.initializeApp(FBCFG), auth = A.getAuth(app);
    try { auth.languageCode = 'tr'; } catch (e) {}
    let fs;
    try { fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch (e) { fs = F.getFirestore(app); }
    S.fb = {app: app, auth: auth, fs: fs, A: A, F: F};
    A.onAuthStateChanged(auth, onFbUser, () => { S.auth = 'error'; schedule(); });
  } catch (e) { S.auth = 'error'; schedule(); }
}

/* Uygulamanın kayıt çağrılarını Firestore'a çevirir. Yazma sözü sunucu onayını beklemez: çevrimdışıyken kayıt
   telefonda kalır, bağlantı gelince gider; sonradan gelen hata ekranda uyarı olarak çıkar. */
function fbAdapter(){
  const F = S.fb.F, fs = S.fb.fs;
  const fire = p => {
    let settled = false;
    p.catch(e => { if (settled) toast(writeMsg(e)); });
    return Promise.race([p, new Promise(r => setTimeout(r, 1500))]).then(v => { settled = true; return v; }, e => { settled = true; throw e; });
  };
  const wrapDoc = ref => ({
    id: ref.id,
    set: body => fire(F.setDoc(ref, body)),
    update: body => fire(F.setDoc(ref, body, {merge: true})),
    delete: () => fire(F.deleteDoc(ref)),
    onSnapshot: (cb, err) => F.onSnapshot(ref, s => cb({exists: s.exists(), data: () => s.data()}), err),
  });
  return {
    collection: path => ({
      onSnapshot: (cb, err) => F.onSnapshot(F.collection(fs, path), q => cb({docs: q.docs.map(d => ({id: d.id, data: () => d.data()}))}), err),
      doc: id => wrapDoc(id ? F.doc(fs, path, id) : F.doc(F.collection(fs, path))),
    }),
    doc: path => wrapDoc(F.doc(fs, path)),
  };
}

function buildSummary(){
  const keep = S.season, out = {v: 1, seasons: {}};
  const ss = new Set([seasonOf(todayStr())]);
  S.records.forEach(r => { if (r.type === 'hasat') { const s = seasonOf(r.date); if (s) ss.add(s); } });
  try {
    ss.forEach(s => {
      S.season = s; const d = derive();
      const byVar = {}, cal = {}, calVar = {};
      Object.keys(d.byVar).forEach(v => { if (d.byVar[v].kg > 0.5) byVar[v] = Math.round(d.byVar[v].kg); });
      CAL_KEYS.forEach(k => { if (d.calTot[k[0]] > 0.5) cal[k[0]] = Math.round(d.calTot[k[0]]); });
      Object.keys(d.calVar).forEach(v => { const o = {}; CAL_KEYS.forEach(k => { const q = d.calVar[v][k[0]]; if (q > 0.5) o[k[0]] = Math.round(q); }); if (Object.keys(o).length) calVar[v] = o; });
      out.seasons[skey(s)] = {label: s, kg: Math.round(d.oliveKg), val: Math.round(d.valTot || 0), days: d.dayCount || 0, last: d.lastHarvest || null, byVar: byVar, cal: cal, calVar: calVar, cost: Math.round(d.cost || 0), income: Math.round(d.income || 0), area: d.area || 0, trees: d.trees || 0, parcels: S.parcels.filter(p => p.active !== false).length};
    });
  } finally { S.season = keep; }

}

function costOf(r){
  switch (r.type) {
    case 'satis': case 'alim': case 'gozlem': return 0;
    case 'gider': return r.cat === INVEST ? 0 : (+r.amount || 0);
    case 'sikim': return r.feeType === 'Ürün payı' ? 0 : (+r.fee || 0);
    default: return +r.cost || 0;
  }
}
function catOf(r){
  if (r.type === 'gider') return r.cat || 'Diğer gider';
  if (r.type === 'sikim') return 'Fabrika (sıkım ücreti)';
  if (r.type === 'hasat') return 'Hasat (nakliye, kasa vb.)';
  return (TYPES[r.type] || {}).label || 'Diğer';
}
const laborCost = l => (l.entries || []).reduce((a, e) => a + (+e.u || 0) * (+e.wage || 0), 0);
const laborUnits = l => (l.entries || []).reduce((a, e) => a + (+e.u || 0), 0);
function spread(ids, amount, key, fn){
  const list = (ids || []).filter(id => PMAP[id]);
  if (!list.length) return false;
  if (!amount) return true;
  const w = list.map(id => (+PMAP[id][key] || +PMAP[id].area || 1));
  const tot = w.reduce((a, b) => a + b, 0);
  list.forEach((id, i) => fn(id, amount * w[i] / tot));
  return true;
}
const pnames = ids => (ids || []).map(id => PMAP[id] ? PMAP[id].name : null).filter(Boolean).join(', ');
const qtyTxt = (q, u) => ok(+q) && q !== '' && q != null ? (num(+q, 2) + ' ' + (u || '')).trim() : '';

function describe(r, ST){

    case 'sulama': title = 'Sulama' + (r.method ? ' · ' + r.method : ''); sub = [+r.hours ? num(+r.hours, 1) + ' saat' : '', +r.water ? num(+r.water) + ' m³' : '']; out = +r.cost || 0; break;
    case 'hasat':

function derive(){
  const sea = S.season, sk = skey(sea), today = todayStr();
  PMAP = {}; S.parcels.forEach(p => { PMAP[p.id] = p; });
  WMAP = {}; S.workers.forEach(w => { WMAP[w.id] = w; });

  const ST = {};
  S.stock.forEach(it => { ST[it.id] = Object.assign({}, it, {bought: 0, used: 0, spent: 0, moves: []}); });
  S.records.forEach(r => {
    if (!r.stockId || !ST[r.stockId]) return;
    const s = ST[r.stockId];
    if (r.type === 'alim') { s.bought += +r.qty || 0; s.spent += +r.total || 0; s.moves.push(r); }
    else if (r.type === 'ilac' || r.type === 'gubre') { s.used += +r.qtyUsed || 0; s.moves.push(r); }
  });
  Object.keys(ST).forEach(k => { const s = ST[k]; s.qty = (+s.opening || 0) + s.bought - s.used; s.avg = s.bought > 0 ? s.spent / s.bought : (+s.price || 0); s.value = Math.max(0, s.qty) * s.avg; s.low = ok(s.min) && s.qty <= s.min; s.moves.sort(byDateDesc); });

  const inS = x => x.date && seasonOf(x.date) === sea;
  const recs = S.records.filter(inS).sort(byDateDesc);
  const labor = S.labor.filter(inS).sort(byDateDesc);
  const pays = S.pay.filter(inS).sort(byDateDesc);
  const months = seasonMonths(sea);
  const mi = date => { const d = parseD(date); return d ? months.findIndex(m => m.y === d.getFullYear() && m.m === d.getMonth() + 1) : -1; };
  const cats = {}; const addCat = (k, v) => { if (v) cats[k] = (cats[k] || 0) + v; };
  let cost = 0, invest = 0, income = 0, depot = 0;
  recs.forEach(r => {
    const c = costOf(r), i = mi(r.date);
    if (c) { cost += c; addCat(catOf(r), c); if (i >= 0) months[i].cost += c; }
    if (r.type === 'satis') { const v = +r.total || 0; income += v; if (i >= 0) months[i].inc += v; }
    if (r.type === 'gider' && r.cat === INVEST) invest += +r.amount || 0;
    if (r.type === 'alim') depot += +r.total || 0;
  });

  const PS = {};
  S.parcels.forEach(p => { PS[p.id] = {cost: 0, kg: 0, last: null, lastH: null, lastSpray: null, safe: null}; });
  const days = {}, byVar = {}, calTot = {}, byPurpose = {}, calVar = {}, calValVar = {}, calVarAll = {}, calValTot = {};
  let calAll = 0, valTot = 0, valKg = 0, oliveKg = 0, serviceKg = 0;
  const hs = recs.filter(r => r.type === 'hasat');
  hs.forEach(r => {
    const kg = +r.kg || 0, sh = ownShare(r), own = kg * sh, val = valueOf(r);
    const d = days[r.date] || (days[r.date] = {date: r.date, kg: 0, svc: 0, all: 0, val: 0, people: 0, recs: [], pk: {}});
    d.kg += own; d.svc += kg - own; d.all += kg; d.people = Math.max(d.people, +r.workers || 0); d.recs.push(r);
    if (val) { d.val += val * sh; valTot += val * sh; valKg += own; }
    oliveKg += own; serviceKg += kg - own;
    const pk = r.purpose || 'Belirtilmemiş'; byPurpose[pk] = (byPurpose[pk] || 0) + own;
    const vk = r.variety || 'Çeşit girilmemiş', vo = byVar[vk] || (byVar[vk] = {kg: 0, val: 0, vkg: 0}); vo.kg += own; vo.val += (val || 0) * sh; if (val) vo.vkg += own;
    if (r.cal) {
      const pr = priceRow(r.variety), cvar = calVar[vk] || (calVar[vk] = {}), vvar = calValVar[vk] || (calValVar[vk] = {});
      CAL_KEYS.forEach(k => {
        const key = k[0], q = (+r.cal[key] || 0) * sh; if (!q) return;
        calTot[key] = (calTot[key] || 0) + q; calAll += q;
        cvar[key] = (cvar[key] || 0) + q; calVarAll[vk] = (calVarAll[vk] || 0) + q;
        if (pr && +pr[key] > 0) { const v = q * pr[key]; vvar[key] = (vvar[key] || 0) + v; calValTot[key] = (calValTot[key] || 0) + v; }
      });
    }
    spread(r.parcels, kg, 'trees', (id, v) => { PS[id].kg += v; d.pk[id] = (d.pk[id] || 0) + v; if (!PS[id].lastH || r.date > PS[id].lastH) PS[id].lastH = r.date; });
  });
  recs.forEach(r => {
    const c = costOf(r);
    if (c) spread(r.parcels, c, 'area', (id, v) => { PS[id].cost += v; });
    (r.parcels || []).forEach(id => { const ps = PS[id]; if (ps && (!ps.last || r.date > ps.last)) ps.last = r.date; });
  });
  let laborTotal = 0, laborDays = 0, harvestDays = 0;
  labor.forEach(l => {
    const c = laborCost(l), u = laborUnits(l), i = mi(l.date);
    laborTotal += c; laborDays += u; if (l.work === 'Hasat') harvestDays += u; if (i >= 0) months[i].cost += c;
    if (l.parcelId && PS[l.parcelId]) PS[l.parcelId].cost += c;
    else if (l.work === 'Hasat' && days[l.date]) { const pk = days[l.date].pk, tot = Object.keys(pk).reduce((a, id) => a + pk[id], 0); if (tot > 0) Object.keys(pk).forEach(id => { PS[id].cost += c * pk[id] / tot; }); }
  });
  cost += laborTotal; addCat('İşçilik (yevmiye)', laborTotal);
  S.records.forEach(r => { if (r.type !== 'ilac') return; (r.parcels || []).forEach(id => { const ps = PS[id]; if (ps && r.date && (!ps.lastSpray || r.date > ps.lastSpray.date)) ps.lastSpray = r; }); });
  Object.keys(PS).forEach(k => { const ps = PS[k]; if (ps.lastSpray && +ps.lastSpray.phi > 0) ps.safe = addDays(ps.lastSpray.date, +ps.lastSpray.phi); });

  Object.keys(days).forEach(k => { const d = days[k]; if (!d.people) { const lu = labor.filter(l => l.date === d.date).reduce((a, l) => a + laborUnits(l), 0); if (lu) d.people = lu; } });
  const dayList = Object.keys(days).map(k => days[k]).sort((a, b) => a.date.localeCompare(b.date));
  let cum = 0; dayList.forEach(d => { cum += d.kg; d.cum = cum; });
  const pd = dayList.filter(d => d.people > 0);
  const kgPerPD = pd.length ? sum(pd, 'all') / sum(pd, 'people') : null;

  let estTotal = 0, estHarv = 0, remaining = 0, estCount = 0;
  S.parcels.filter(p => p.active !== false && p.own !== CUST).forEach(p => {
    const e = p.est && ok(p.est[sk]) ? p.est[sk] : null; if (e == null) return;
    estCount++; estTotal += e; const k = PS[p.id].kg; estHarv += k;
    if (!(p.done && p.done[sk])) remaining += Math.max(0, e - k);
  });

  const sik = recs.filter(r => r.type === 'sikim');
  const sikOlive = sum(sik, 'oliveKg'), oilGross = sum(sik, 'oilKg');
  const millKg = sum(sik, r => r.feeType === 'Ürün payı' ? (+r.oilKg || 0) * (+r.share || 0) / 100 : 0);
  const oilNet = oilGross - millKg;
  const yieldPct = sikOlive > 0 && oilGross > 0 ? oilGross / sikOlive * 100 : null;
  const acidRecs = sik.filter(r => ok(r.acidity) && +r.oilKg > 0);
  const acid = acidRecs.length ? sum(acidRecs, r => r.acidity * r.oilKg) / sum(acidRecs, 'oilKg') : null;
  const oilSales = recs.filter(r => r.type === 'satis' && r.cat === 'Zeytinyağı');
  const oilSoldKg = sum(oilSales, r => oilKgOf(r.qty, r.unit) || 0);
  const oilIncome = sum(oilSales.filter(r => oilKgOf(r.qty, r.unit)), 'total');
  const prodSales = sum(recs.filter(r => r.type === 'satis' && PRODUCT_SALES.indexOf(r.cat) >= 0), 'total');
  const meth = {};
  hs.forEach(r => { const k = r.method || 'Belirtilmemiş'; const o = meth[k] || (meth[k] = {kg: 0, wd: 0, wkg: 0, n: 0, mh: 0}); o.kg += +r.kg || 0; o.n++; if (+r.workers > 0) { o.wd += +r.workers; o.wkg += +r.kg || 0; } o.mh += +r.mHours || 0; });

  const own = S.parcels.filter(p => p.active !== false && p.own !== CUST);
  const trees = sum(own, 'trees') || (+S.settings.trees || 0);
  const area = sum(own, 'area') || (+S.settings.area || 0);

  const alacak = S.records.filter(r => r.type === 'satis' && r.status === 'Vadeli').sort(byDue);
  const borc = S.records.filter(r => (r.type === 'gider' || r.type === 'alim') && r.status === 'Borç').sort(byDue);
  const WB = {}; const wb = id => WB[id] || (WB[id] = {earned: 0, paid: 0, days: 0, sdays: 0});
  S.labor.forEach(l => (l.entries || []).forEach(e => { const o = wb(e.w); o.earned += (+e.u || 0) * (+e.wage || 0); o.days += +e.u || 0; if (inS(l)) o.sdays += +e.u || 0; }));
  S.pay.forEach(p => { if (p.workerId) wb(p.workerId).paid += +p.amount || 0; });
  const unpaid = Object.keys(WB).reduce((a, k) => a + Math.max(0, WB[k].earned - WB[k].paid), 0);

  const mismatch = hs.filter(calMismatch);
  const noPrice = Array.from(new Set(hs.filter(r => calSum(r) > 0 && !valueOf(r)).map(r => r.variety || 'Çeşit girilmemiş')));
  const alerts = [];
  S.parcels.forEach(p => { const ps = PS[p.id]; if (ps.safe && ps.safe > today) alerts.push({sev: 'bad', t: p.name + ': hasat için en erken ' + fmtD(ps.safe), d: 'Son ilaçlama ' + fmtDs(ps.lastSpray.date) + ' · ' + (ps.lastSpray.product || 'ilaç') + ' · bekleme ' + num(+ps.lastSpray.phi) + ' gün', go: 'bahceler'}); });
  if (mismatch.length) alerts.push({sev: 'warn', t: mismatch.length + ' hasat kaydında elek toplamı tutmuyor', d: mismatch.slice(0, 3).map(r => fmtDs(r.date) + ' ' + (pnames(r.parcels) || '') + ': elekler ' + num(calSum(r)) + ' kg, toplam ' + num(+r.kg || 0) + ' kg').join(' · '), go: 'hasat'});
  if (noPrice.length) alerts.push({sev: 'info', t: 'Fiyat listesinde eksik çeşit: ' + noPrice.join(', '), d: 'Bu çeşitlerin tahmini değeri hesaplanmıyor', go: 'hasat'});
  Object.keys(ST).forEach(k => { const s = ST[k]; if (s.low) alerts.push({sev: 'warn', t: s.name + ': depoda ' + num(s.qty, 2) + ' ' + (s.unit || '') + ' kaldı', d: 'Uyarı seviyesi ' + num(s.min, 2) + ' ' + (s.unit || ''), go: 'depo'}); });
  alacak.filter(r => r.due && r.due < today).forEach(r => alerts.push({sev: 'bad', t: 'Vadesi geçen alacak: ' + (r.buyer || r.cat || 'satış'), d: tl(+r.total || 0) + ' · vade ' + fmtDs(r.due)}));
  borc.filter(r => r.due && diffDays(r.due, today) <= 7).forEach(r => alerts.push({sev: r.due < today ? 'bad' : 'warn', t: (r.due < today ? 'Vadesi geçen' : 'Yaklaşan') + ' ödeme: ' + (r.to || r.supplier || r.cat || 'borç'), d: tl(+(r.type === 'alim' ? r.total : r.amount) || 0) + ' · vade ' + fmtDs(r.due)}));
  S.parcels.filter(p => p.own === 'İcar' && p.contractEnd && p.active !== false).forEach(p => { const dd = diffDays(p.contractEnd, today); if (dd <= 60) alerts.push({sev: dd < 0 ? 'bad' : 'warn', t: p.name + ': icar sözleşmesi ' + (dd < 0 ? 'bitti' : 'bitiyor'), d: 'Bitiş ' + fmtD(p.contractEnd) + (p.owner ? ' · ' + p.owner : ''), go: 'bahceler'}); });
  const late = S.tasks.filter(t => !t.done && t.due && t.due < today);
  if (late.length) alerts.push({sev: 'warn', t: late.length + ' gecikmiş iş', d: late.slice(0, 3).map(t => t.title).join(' · '), go: 'takvim'});
  if (unpaid > 0.5) alerts.push({sev: 'info', t: 'Ödenmemiş yevmiye: ' + tl(unpaid), d: 'Kişi kişi Ekip sekmesinde', go: 'ekip'});

  const entries = recs.map(r => describe(r, ST)).concat(labor.map(describeLabor), pays.map(describePay))
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.created || '').localeCompare(String(a.created || '')));
  entries.forEach(e => { e.search = lower([e.label, e.title, e.sub, e.pn, e.note].join(' ')); });
  const td = days[today];

  return {ST, PS, WB, recs, labor, pays, entries, months, cats, cost, invest, income, depot, laborTotal, laborDays, harvestDays,
    hs, days, dayList, dayCount: dayList.length, firstHarvest: dayList.length ? dayList[0].date : null, lastHarvest: dayList.length ? dayList[dayList.length - 1].date : null,
    todayKg: td ? td.kg : 0, todayRecs: td ? td.recs.length : 0, kgPerPD, byVar, calTot, calAll, calVar, calValVar, calVarAll, calValTot, valTot, valKg, oliveKg, serviceKg, byPurpose,
    estTotal, estHarv, remaining, estCount, mismatch,
    sik, sikOlive, oilGross, millKg, oilNet, yieldPct, acid, oilSoldKg, oilIncome, prodSales, meth,
    trees, area, alacak, borc, alacakTotal: sum(alacak, 'total'), unpaid, alerts};
}

function niceMax(v){ if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barChart(labels, series, opt){
  opt = opt || {};
  const W = opt.w || Math.max(300, Math.min(1000, (document.documentElement.clientWidth || 800) - 60)), H = opt.h || 210;
  const padL = 46, padR = 6, padT = 10, padB = 24;
  const max = niceMax(Math.max(0, ...series.reduce((a, s) => a.concat(s.values), [])));
  const n = labels.length, gw = (W - padL - padR) / n, ih = H - padT - padB;
  const bw = Math.max(2, Math.min(20, (gw - Math.min(6, gw * 0.3)) / series.length));
  const y = v => padT + ih * (1 - v / max);
  const fmt = opt.fmt || compact;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); g += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '"/><text x="' + (padL - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end">' + esc(fmt(v)) + '</text>'; }
  let b = '';
  labels.forEach((lab, i) => {
    const x0 = padL + gw * i + (gw - bw * series.length) / 2;
    series.forEach((s, j) => { const v = s.values[i] || 0; if (v > 0) { const yy = y(v), h = Math.max(1.5, padT + ih - yy); b += '<rect class="' + s.cls + '" x="' + (x0 + bw * j).toFixed(1) + '" y="' + (padT + ih - h).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"><title>' + esc((opt.tl ? opt.tl[i] : lab) + ' · ' + s.name + ': ' + (opt.tip ? opt.tip(v) : tl(v))) + '</title></rect>'; } });
    if (lab) g += '<text x="' + (padL + gw * i + gw / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(lab) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.label || 'grafik') + '">' + g + b + '</svg>';
}

function dayRange(){

/* ---------- Takvim ---------- */
function vTakvim(){
  const today = todayStr(), in30 = addDays(today, 30);
  const open = S.tasks.filter(t => !t.done).sort(byDue);
  const late = open.filter(t => t.due && t.due < today), soon = open.filter(t => t.due && t.due >= today && t.due <= in30), later = open.filter(t => !t.due || t.due > in30);
  const done = S.tasks.filter(t => t.done).sort((a, b) => String(b.doneAt || b.updatedAt || '').localeCompare(String(a.doneAt || a.updatedAt || '')));
  let body;
  if (colLoading('tasks')) body = loadingBox();
  else if (!S.tasks.length) body = emptyBox('Yapılacak iş yok', 'İlaçlama günü, fabrika sırası, tüccar görüşmesi, makine bakımı… tarihiyle ekle, günü geçince Pano uyarsın.', btnNew('task', 'İş ekle', 'btn-p'));
  else {
    body = '<div class="panel tasks">';
    if (late.length) body += '<div class="task-h">Gecikmiş</div>' + late.map(taskRow).join('');
    if (soon.length) body += '<div class="task-h">Önümüzdeki 30 gün</div>' + soon.map(taskRow).join('');
    if (later.length) body += '<div class="task-h">Daha sonra</div>' + later.map(taskRow).join('');
    if (!open.length) body += '<div class="task-h">Açık iş kalmadı</div>';
    if (done.length) body += '<details class="done-list"><summary>Tamamlanan ' + done.length + ' iş</summary>' + done.slice(0, 30).map(taskRow).join('') + '</details>';
    body += '</div>';
  }
  let h = '<div class="sh first"><h2>Yapılacaklar</h2><span class="meta">' + open.length + ' açık iş</span><div class="acts">' + btnNew('task', '+ İş ekle', 'btn-p') + '</div></div>' + body;
  const m0 = new Date().getMonth();
  h += sec('Zeytin bakım takvimi', 'önümüzdeki 12 ay', '<div class="months">' + Array.from({length: 12}, (_, i) => (m0 + i) % 12).map((m, i) => '<div class="mon' + (i === 0 ? ' now' : '') + '"><h3>' + CAL[m].m + (i === 0 ? '<span>bu ay</span>' : '') + '</h3><ul>' + CAL[m].items.map(it => '<li><span><span class="chip tone-' + CAL_TONE[it[0]] + '">' + esc(it[0]) + '</span></span><span>' + esc(it[1]) + '</span></li>').join('') + '</ul></div>').join('') + '</div><p class="note-s">Ege için genel bir rehberdir. İlaç ve gübre kararını gözlem, analiz ve reçeteye göre ver; doz ve bekleme süresinde etiket esastır.</p>');
  return h;
}

function ago(iso){
  const d = String(iso || '').slice(0, 10); if (!parseD(d)) return '';
  const n = diffDays(todayStr(), d);
  return n <= 0 ? 'bugün' : n === 1 ? 'dün' : n < 30 ? n + ' gün önce' : fmtDs(d);
}

  }).join('') + '</div>' : emptyBox('Henüz kullanıcı yok', 'Linki paylaştığın kişiler kayıt olunca burada görünür.', ''));
  const vars = Object.keys(t.byVar).filter(v => t.byVar[v] > 0).sort((a, b) => t.byVar[b] - t.byVar[a]);

    const cv = vars.filter(v => t.calVar[v]);

      body += '<details class="mx" open><summary>Çeşit ve elek tablosu (bütün kullanıcılar)</summary><div class="tw"><table><thead><tr><th>Elek (kg)</th>' + cv.map(v => '<th class="n">' + esc(v) + '</th>').join('') + '<th class="n">Toplam</th></tr></thead><tbody>' +
        CAL_KEYS.map(c => { const tt = t.cal[c[0]] || 0; return '<tr' + (tt ? '' : ' class="z"') + '><td>' + esc(c[1]) + '</td>' + cv.map(v => { const x = t.calVar[v][c[0]] || 0; return '<td class="n">' + (x ? num(x) : '–') + '</td>'; }).join('') + '<td class="n">' + (tt ? num(tt) : '–') + '</td></tr>'; }).join('') +
        '</tbody><tfoot><tr><td>Toplam</td>' + cv.map(v => '<td class="n">' + num(t.byVar[v]) + '</td>').join('') + '<td class="n">' + num(t.kg) + '</td></tr></tfoot></table></div></details>';
    }
    h += sec('Çeşitlere göre', 'bütün kullanıcılar · ' + esc(S.season), body);
  }
  h += '<p class="note-s">Liste, her kullanıcının uygulamayı son açışında gönderdiği özetten gelir. Bir kişinin ayrıntısı için adına dokun.</p>';

function collect(form, fields){

  const form = t.closest('#frm'); if (!form) return;
  if (t.name && (t.type === 'text' || t.tagName === 'TEXTAREA')) t.dataset.touched = t.value.trim() ? '1' : '';
  refreshForm(t.name || null);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'seasonSel') { S.season = t.value; S.seasonPicked = true; render(); return; }
  if (t.id === 'fp') { S.f.p = t.value; $('#ledgerList').innerHTML = ledgerList(); return; }
  if (t.id === 'addVar' && t.value) { const form = $('#pfrm'), keep = form ? readPrices(form) : {}; return openPrices(S.sheet.vars.concat(t.value), keep); }
  if (t.id === 'impFile') {
    const f = t.files && t.files[0]; if (!f) return showImport(null);
    const rd = new FileReader();
    rd.onload = () => showImport(parseBackup(String(rd.result || '')));
    rd.onerror = () => showImport({err: 'Dosya okunamadı.'});
    rd.readAsText(f);
    return;
  }
  if (G && t.dataset && t.dataset.task) { t.checked = !t.checked; toast(RO_MSG); return; }
  if (t.dataset && t.dataset.task) {
    const done = t.checked;
    dbUpdate('tasks', t.dataset.task, {done: done, doneAt: done ? todayStr() : null, updatedAt: new Date().toISOString()}).then(() => toast(done ? 'Tamamlandı' : 'Yeniden açıldı')).catch(err => { t.checked = !done; toast(writeMsg(err)); });
    return;
  }
  const form = t.closest('#frm'); if (form && t.type !== 'text') refreshForm(t.name || null);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'authForm') return doAuth(e.target);
  if (id === 'consentForm') { const f = e.target; if (!f.elements.ok.checked) return authErr('Devam etmek için onay kutusunu işaretle.'); authBusy(true); return saveConsent(f.elements.name.value.trim()); }
  if (G) { toast(RO_MSG); return; }
  if (id === 'frm') return submitForm(false);
  if (id === 'setForm') return saveSettings(e.target);
  if (id === 'pfrm') return savePrices(e.target);
  if (id === 'ifrm') return doImport();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (Math.abs(document.documentElement.clientWidth - lastW) > 60) render(); }, 200); });

window.addEventListener('online', () => schedule());
window.addEventListener('offline', () => schedule());

/* ---------- başlat ---------- */
S.view = VIEWS[location.hash.replace('#', '')] ? location.hash.replace('#', '') : 'pano';
render();
connect();
if (FBCFG && 'serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
})();
</script>
</html>
